name: Galaxy Offline Ecosystem

on:
  push:
    paths:
      - "Galaxy_S25_Offline_Ecosystem/**"
      - ".github/workflows/galaxy-ecosystem.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galaxy-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Galaxy_S25_Offline_Ecosystem

jobs:
  build:
    name: Derleme, birim testleri ve güvenlik denetimi
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Bu dalda da önbellek yazılsın: dış indirme sunucusu kesintideyken sonraki çalıştırmalar etkilenmesin.
          cache-read-only: false

      - name: İsteğe bağlı kalıcı imza anahtarı
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > galaxy-offline.jks
            printf 'storeFile=galaxy-offline.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          fi

      - name: Stockfish ikilileri (Satranç uygulaması; önbellekten, yoksa derlenip doğrulanır)
        id: sf_cache
        uses: actions/cache@v4
        with:
          path: Galaxy_S25_Offline_Ecosystem/12_Games/213_Chess/engine/prebuilt
          key: stockfish-${{ hashFiles('Galaxy_S25_Offline_Ecosystem/12_Games/213_Chess/engine/stockfish.env', 'Galaxy_S25_Offline_Ecosystem/12_Games/213_Chess/engine/build_stockfish.sh', 'Galaxy_S25_Offline_Ecosystem/12_Games/213_Chess/engine/perft_tricky.txt') }}

      - name: Stockfish derleme (önbellekte yoksa)
        if: steps.sf_cache.outputs.cache-hit != 'true'
        working-directory: Galaxy_S25_Offline_Ecosystem/12_Games/213_Chess/engine
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q qemu-user-static expect
          source stockfish.env
          for i in 1 2 3 4 5; do
            echo "y" | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null && break
            echo "NDK indirilemedi ($i/5)"; sleep 30
          done
          ./build_stockfish.sh "$PWD/prebuilt"

      - name: Gradle dağıtımını indir (geçici sunucu hatalarına karşı yeniden dener)
        run: |
          for i in $(seq 1 20); do
            ./gradlew --no-daemon --version && exit 0
            echo "İndirme başarısız ($i/20), 60 sn sonra yeniden denenecek"; sleep 60
          done
          exit 1

      - name: Birim testleri
        run: ./gradlew --no-daemon test

      - name: Reklam/analiz/telemetri bağımlılık denetimi
        run: ./gradlew --no-daemon verifyNoTrackers

      - name: APK derleme (release + debug + cihaz testleri)
        run: ./gradlew --no-daemon assembleRelease assembleDebug assembleDebugAndroidTest

      - name: APK denetimi (izinler, INTERNET, yasaklı SDK)
        run: tools/audit_apks.sh build/ci

      - name: Satranç motoru için GPL-3 karşılık gelen kaynak paketi (APK'larla aynı artefakta)
        run: |
          cp 12_Games/213_Chess/engine/prebuilt/stockfish-*-corresponding-source.tar.gz build/ci/release/
          cp 12_Games/213_Chess/engine/prebuilt/BUILDINFO.txt build/ci/release/STOCKFISH_BUILDINFO.txt
          ( cd build/ci/release && sha256sum stockfish-*-corresponding-source.tar.gz >> SHA256SUMS.txt )

      - name: Rapor
        if: always()
        run: cat build/ci/audit.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        with:
          name: galaxy-release-apks
          path: |
            Galaxy_S25_Offline_Ecosystem/build/ci/release/
            Galaxy_S25_Offline_Ecosystem/build/ci/audit.md
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: galaxy-ci-internal
          path: |
            Galaxy_S25_Offline_Ecosystem/build/ci/
            Galaxy_S25_Offline_Ecosystem/**/schemas/
          retention-days: 7

  device:
    name: Emülatör testleri (Android 15) – parça ${{ matrix.shard }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: galaxy-ci-internal
          path: ci-artifact
      - name: KVM etkinleştir
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emülatörde kurulum, açılış ve cihaz testleri
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: Galaxy_S25_Offline_Ecosystem
          script: bash tools/device_tests.sh ../ci-artifact/build/ci ${{ matrix.shard }} 4 || true
      - name: Emülatör çöktüyse test edilemeyenleri yeni emülatörde tekrar dene
        id: retry_check
        run: |
          st=$(cat ../ci-artifact/build/ci/status-${{ matrix.shard }}.txt 2>/dev/null || echo 2)
          echo "status=$st" >> "$GITHUB_OUTPUT"
          if [ "$st" -ge 2 ]; then cp ../ci-artifact/build/ci/untested-${{ matrix.shard }}.txt ../ci-artifact/build/ci/untested-${{ matrix.shard }}.txt.prev; fi
      - name: Tekrar deneme (yalnızca emülatör çökmesinden etkilenen paketler)
        if: steps.retry_check.outputs.status >= 2
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RETRY: 1
          NOSHOT: 1
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: Galaxy_S25_Offline_Ecosystem
          script: bash tools/device_tests.sh ../ci-artifact/build/ci ${{ matrix.shard }} 4 || true
      - name: Sonuç
        run: |
          d=../ci-artifact/build/ci; s1=$(cat $d/status-${{ matrix.shard }}.txt 2>/dev/null || echo 2)
          echo "İlk deneme durumu: $s1"
          [ "$s1" = 1 ] || [ "$s1" = 3 ] && { echo "Cihaz testlerinde hata var"; exit 1; }
          if [ "$s1" -ge 2 ]; then
            s2=$(cat $d/status-${{ matrix.shard }}-tekrar.txt 2>/dev/null || echo 2)
            echo "Tekrar deneme durumu: $s2"; [ "$s2" = 0 ] || exit 1
          fi
      - name: Rapor
        if: always()
        run: cat ../ci-artifact/build/ci/device-${{ matrix.shard }}*.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galaxy-device-report-${{ matrix.shard }}
          path: |
            ci-artifact/build/ci/device-*.md
            ci-artifact/build/ci/screenshots/
