name: Finans Asistanı APK

on:
  push:
    paths:
      - "apps/FinansAsistani/**"
      - ".github/workflows/finans-asistani-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/FinansAsistani
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # İsteğe bağlı: depo gizli anahtarları (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)
      # tanımlıysa APK kalıcı sürüm anahtarıyla imzalanır; yoksa debug anahtarı kullanılır.
      - name: Sürüm anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > finans-asistani.jks
            {
              echo "storeFile=finans-asistani.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "Sürüm anahtarı kullanılacak."
          else
            echo "Sürüm anahtarı tanımlı değil; debug anahtarıyla imzalanacak."
          fi

      - name: Birim testleri ve APK derlemesi
        run: ./gradlew --no-daemon --stacktrace :core:test :app:assembleRelease

      - name: İzin ve ağ bileşeni denetimi
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          echo "--- İzinler ---"
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          if grep -q "uses-permission" permissions.txt; then
            echo "::error::APK izin içeriyor; uygulama hiçbir izin istememeli."
            exit 1
          fi
          "$AAPT2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label)" || true
          ls -la "$APK"
          sha256sum "$APK" | tee app-release.apk.sha256

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: FinansAsistani-${{ github.sha }}
          path: |
            apps/FinansAsistani/app/build/outputs/apk/release/app-release.apk
            apps/FinansAsistani/app-release.apk.sha256
            apps/FinansAsistani/app/schemas/
          if-no-files-found: error
