name: Chess Engine (Stockfish Android)

# Yalnızca satranç motoru dosyaları değişince çalışır; diğer uygulamaların iş akışını etkilemez.
on:
  push:
    paths:
      - "Galaxy_S25_Offline_Ecosystem/12_Games/213_Chess/engine/**"
      - ".github/workflows/chess-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chess-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stockfish:
    name: Stockfish derleme ve doğrulama (arm64 + x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Galaxy_S25_Offline_Ecosystem/12_Games/213_Chess/engine
    steps:
      - uses: actions/checkout@v4
      - name: "Araçlar (qemu ile arm64 ikilisi doğrulanır, expect ile Stockfish perft testi)"
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user-static expect
      - name: NDK kurulumu (sabit sürüm)
        run: |
          source stockfish.env
          for i in 1 2 3 4 5; do
            echo "y" | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" >/dev/null && break
            echo "NDK indirilemedi ($i/5), yeniden denenecek"; sleep 30
          done
          ls "$ANDROID_SDK_ROOT/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++"
      - name: Derle, doğrula, paketle
        run: ./build_stockfish.sh "$GITHUB_WORKSPACE/stockfish-out"
      - name: Özet
        if: always()
        run: |
          { echo '## Stockfish Android derlemesi'; echo '```'; cat "$GITHUB_WORKSPACE/stockfish-out/BUILDINFO.txt" 2>/dev/null || echo "BUILDINFO yok (derleme başarısız)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: stockfish-android
          path: stockfish-out/
          if-no-files-found: error
